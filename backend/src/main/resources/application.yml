spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pawback}
    username: ${DB_USER:pawback_user}
    password: ${DB_PASSWORD:pawback_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

jwt:
  secret: ${JWT_SECRET:pawback_secret_key_that_is_at_least_256_bits_long_for_hs256_algorithm}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 8080

minio:
  url: ${MINIO_URL:http://pawback-minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: pawback-images
